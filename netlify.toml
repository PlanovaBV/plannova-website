# Netlify: statische site, geen build-stap
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Hoofdadres is plannovabv.nl (www.plannovabv.nl stuurt Netlify zelf door).
# Het oude adres planovabv.nl (met en zonder www) stuurt blijvend door naar het
# nieuwe adres, zodat oude links en de QR-code op de visitekaartjes blijven werken.
[[redirects]]
  from = "https://planovabv.nl/*"
  to = "https://plannovabv.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.planovabv.nl/*"
  to = "https://plannovabv.nl/:splat"
  status = 301
  force = true

# Contactkaarten (vCard) voor de QR-code op de visitekaartjes
[[headers]]
  for = "/contact/*.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=3600"
